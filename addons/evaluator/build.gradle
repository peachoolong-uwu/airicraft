plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "airicraft-evaluator"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"airicraft-evaluator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	evaluatorRuntimeMods {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}

	evaluatorRuntimeLibraries {
		canBeConsumed = false
		canBeResolved = true
		transitive = true
	}

	testRuntimeOnly.extendsFrom(evaluatorRuntimeLibraries)
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	clientCompileOnly rootProject.sourceSets.main.output
	clientCompileOnly rootProject.sourceSets.client.output
	implementation "org.yaml:snakeyaml:2.4"

	evaluatorRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	evaluatorRuntimeLibraries "org.yaml:snakeyaml:2.4"
	evaluatorRuntimeLibraries "io.opentelemetry:opentelemetry-api:1.60.1"
	evaluatorRuntimeLibraries "io.opentelemetry:opentelemetry-sdk:1.60.1"
	evaluatorRuntimeLibraries "io.opentelemetry:opentelemetry-exporter-otlp:1.60.1"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation rootProject.sourceSets.main.output
	testImplementation rootProject.sourceSets.client.output
	// Runtime fixtures instantiate the root client, including its Baritone tool schemas.
	testRuntimeOnly files(rootProject.sourceSets.client.runtimeClasspath)
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("test") {
	useJUnitPlatform()
}

def sharedDevRunDir = rootProject.layout.projectDirectory.dir("run")
def journeyMapCompatProject = rootProject.findProject(":compat:journeymap")
def evaluatorRunDir = providers.gradleProperty("airicraft.evaluator.runDir")
	.orElse(sharedDevRunDir.asFile.absolutePath)
def evaluatorJdwpEnabled = providers.gradleProperty("airicraft.evaluator.jdwp.enabled")
	.orElse("true")
def evaluatorRuntimePrepared = providers.gradleProperty("airicraft.evaluator.runtimePrepared")
	.orElse("false")
def evaluatorRecorderJar = providers.gradleProperty("airicraft.evaluator.recorderJar")
def evaluatorScenariosDir = rootProject.layout.projectDirectory.dir("scenarios")

if (evaluatorRuntimePrepared.get().toBoolean()) {
	tasks.named("remapJar") {
		onlyIf { false }
	}
}

def configureEvaluatorProcess = { task ->
	task.runDir = file(evaluatorRunDir.get())
	task.jvmArgs.add("-Dairicraft.scenariosDir=${evaluatorScenariosDir.asFile.absolutePath}")
	if (evaluatorJdwpEnabled.get().toBoolean()) {
		task.jvmArgs.add("-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5008")
	}
}

def configureEvaluatorRecordingProfile = { task ->
	if (evaluatorRecorderJar.isPresent()) {
		def profile = rootProject.file(evaluatorRecorderJar.get())
		if (!profile.isFile()) {
			throw new GradleException("Recording profile does not exist: ${profile}")
		}
		task.mods.from(profile)
	}
}

tasks.register("runClientEvaluator", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "airicraft evaluation"
	description = "Runs a production-style Fabric client with Airicraft and the evaluator addon."
	dependsOn rootProject.tasks.named("prepareMinecraftRunOptions")
	dependsOn rootProject.tasks.named("remapJar")
	dependsOn tasks.named("remapJar")
	outputs.upToDateWhen { false }

	mods.from(rootProject.tasks.named("remapJar").flatMap { it.archiveFile })
	mods.from(tasks.named("remapJar").flatMap { it.archiveFile })
	mods.from(configurations.evaluatorRuntimeMods)
	mods.from(rootProject.layout.projectDirectory.files(
		"libs/baritone-unoptimized-fabric-1.15.0.jar",
		"libs/nether-pathfinder-1.4.1.jar"
	))
	configureEvaluatorRecordingProfile(delegate)
	classpath.from(configurations.evaluatorRuntimeLibraries)
	configureEvaluatorProcess(delegate)
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

if (journeyMapCompatProject != null) {
	def journeyMapCompatCacheDir = rootProject.layout.projectDirectory.dir(".airicraft-compat/integration")
	def journeyMapCompatModsDir = journeyMapCompatCacheDir.dir("mods")
	def journeyMapCompatLibrariesDir = journeyMapCompatCacheDir.dir("libraries")

	tasks.register("runClientCompatEvaluator", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
		group = "airicraft evaluation"
		description = "Runs a production-style Fabric client with Airicraft, the evaluator addon, and evaluator-stable compatibility smoke mods."
		dependsOn rootProject.tasks.named("prepareMinecraftRunOptions")
		if (!evaluatorRuntimePrepared.get().toBoolean()) {
			dependsOn tasks.named("remapJar")
			dependsOn journeyMapCompatProject.tasks.named("syncJourneyMapCompatMods")
			dependsOn journeyMapCompatProject.tasks.named("syncJourneyMapCompatLibraries")
		}
		outputs.upToDateWhen { false }

		// Interactive automatic playtests use every integration; retain the batch evaluator's profile.
		def excludedMods = providers.gradleProperty("airicraft.automaticPlaytest").orElse("false").get().toBoolean() ? [] : [
			"airicraft-journeymap-compat-*.jar",
			"journeymap-*.jar"
		]
		mods.from(rootProject.fileTree(dir: journeyMapCompatModsDir.asFile, exclude: excludedMods))
		if (evaluatorRuntimePrepared.get().toBoolean()) {
			mods.from(tasks.named("remapJar").get().archiveFile.get().asFile)
		}
		else {
			mods.from(tasks.named("remapJar").flatMap { it.archiveFile })
		}
		configureEvaluatorRecordingProfile(delegate)
		classpath.from(configurations.evaluatorRuntimeLibraries)
		classpath.from(journeyMapCompatLibrariesDir)
		configureEvaluatorProcess(delegate)
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}
}
